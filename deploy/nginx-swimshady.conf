# Paste into the RunCloud web app NGINX config (server context, not inside a location).
# RunCloud → Web Application → NGINX Config → Add NGINX Config.
#
# The ESP32 HTTP client requires a real Content-Length and cannot read chunked
# or gzipped bodies. nginx gzip drops Content-Length. This app is small; turn
# gzip off for the whole vhost. Also raise the upload cap for firmware .bin files.

gzip off;
client_max_body_size 20m;
