# Sample secrets file. Copy to secrets.yaml (git-ignored) and fill in real values.
# DO NOT put real values in this sample.

# Wi-Fi (2.4 GHz IoT network)
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# Swim Shady cloud heartbeat
# Laravel app on RunCloud. Path must end in /heartbeat; the device derives /state from it.
swimshady_url: "https://swimshady.derekfreeze.com/api/device/heartbeat"
swimshady_token: "YOUR_DEVICE_TOKEN"
